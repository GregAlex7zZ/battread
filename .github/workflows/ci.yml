name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/check_code_docs.py
      - run: pre-commit run --all-files
      # Resolve the interpreter used to install this job's dependencies.
      - run: python -m pyright --pythonpath "$(command -v python)"
      - run: pytest
      - run: mkdocs build --strict
      - run: python -m build

  supported-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      # Resolve the interpreter used to install this job's dependencies.
      - run: python -m pyright --pythonpath "$(command -v python)"

  optional-extra-installation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [biologic, neware]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.extra }}]"
      - run: python -c "import battread"

  vendor-acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,biologic,neware]"
      - run: pytest tests/readers/test_biologic.py tests/readers/test_mpr_streaming.py tests/readers/test_neware.py

  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "numpy==1.26.4" "pandas==2.2.3" "pyarrow==15.0.2"
      - run: pytest
      # Resolve the interpreter used to install this job's dependencies.
      - run: python -m pyright --pythonpath "$(command -v python)"
