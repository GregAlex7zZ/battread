[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"


[project]
name = "battread"
version = "0.1.0"
description = "Vendor-independent standardization of electrochemical cycling data."
authors = [{name = "Alessandro Gregucci"}]
maintainers = [{name = "Alessandro Gregucci"}]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT.md", "licenses/*.txt"]

keywords = [
    "electrochemistry",
    "battery",
    "battery-cycling",
    "battery-data",
    "biologic",
    "neware",
    "data-standardization",
    "scientific-python",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "pyarrow>=15.0.2",
]


[project.urls]
Repository = "https://github.com/GregAlex7zZ/battread"
Issues = "https://github.com/GregAlex7zZ/battread/issues"

[project.optional-dependencies]
biologic = [
    "galvani>=0.5.0,<0.6",
]
neware = [
    "NewareNDA==2026.6.11",
]
all = [
    "galvani>=0.5.0,<0.6",
    "NewareNDA==2026.6.11",
]
dev = [
    "build>=1.2.2",
    "pandas-stubs>=2.2.3",
    "pre-commit>=4.2",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.12",
    "mkdocstrings[python]>=0.29.1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/battread"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/**/*.py", "/src/**/py.typed", "/tests/**/*.py", "/docs/**/*.md",
    "/tools/check_code_docs.py", "/benchmarks/*.py", "/benchmarks/*.md",
    "/benchmarks/*.json", "/examples/getting_started.ipynb", "/licenses/*.txt",
    "/README.md", "/LICENSE", "/COPYRIGHT.md", "/AUTHORS.md",
    "/CONTRIBUTING.md", "/CHANGELOG.md", "/CODE_OF_CONDUCT.md", "/SECURITY.md",
    "/THIRD_PARTY_NOTICES.md", "/TODO.md", "/pyproject.toml", "/mkdocs.yml",
    "/.gitignore", "/.gitattributes", "/.editorconfig", "/.pre-commit-config.yaml",
    "/.github/workflows/*.yml",
    "/tests/data/biologic/README.md", "/tests/data/biologic/CC-BY-4.0.txt",
    "/tests/data/biologic/020-formation_CB5.mpr",
    "/tests/data/biologic/020-formation_CB5.mpr.license",
    "/tests/data/biologic/020-formation_CB5.mpt",
    "/tests/data/biologic/020-formation_CB5.mpt.license",
    "/tests/data/neware/README.md", "/tests/data/neware/LICENSE",
    "/tests/data/neware/prefix.nda", "/tests/data/neware/small.ndax",
    "/tests/data/neware/conflicting.ndax",
]
exclude = ["/.cache/**", "/.pre-commit-cache/**"]


[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.md", ".cache", ".pre-commit-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]


[tool.coverage.run]
branch = true
source = ["battread"]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = "none"
