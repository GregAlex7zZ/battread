site_name: battread
site_description: Vendor-independent standardization of electrochemical cycling data.
docs_dir: docs
site_dir: site
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Usage:
      - Getting started: user-guide/index.md
      - Large files: user-guide/large-files.md
      - Canonical data and merge: user-guide/canonical-data.md
      - Column recognition: recognition.md
      - Delimited inputs: user-guide/reading-delimited.md
      - Writing and conversion: user-guide/writing-and-conversion.md
      - Current reconstruction: user-guide/current-reconstruction.md
  - Readers:
      - Overview: readers/index.md
      - Bio-Logic: readers/biologic.md
      - Neware: readers/neware.md
  - API: api/index.md
  - Development:
      - Overview: developer-guide/index.md
      - Understanding the code: developer-guide/code-guide.md
      - Dependencies: developer-guide/dependencies.md
      - Benchmarks: developer-guide/benchmarks.md
      - MPR architecture: developer-guide/mpr-reader.md
      - Bio-Logic dq decision: adr/0003-biologic-dq-preference.md
      - Neware records decision: adr/0004-neware-strict-records.md
      - Typed pandas decision: adr/0005-typed-pandas-boundary.md
      - CSV total-clock decision: adr/0009-csv-total-time-preference.md
